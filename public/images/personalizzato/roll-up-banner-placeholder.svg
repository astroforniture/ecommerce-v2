<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">PLACEHOLDER — ASFORNITURE Espositori e Roll-Up Retroilluminati</title>
  <desc id="desc">Banner segnaposto: l&apos;immagine ufficiale non è ancora stata fornita. Sostituire con l&apos;artwork ASFORNITURE Espositori e Roll-Up Retroilluminati.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8eef5"/>
      <stop offset="55%" stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#dfe7f0"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="560" fill="url(#bg)"/>
  <rect x="24" y="24" width="1352" height="512" rx="18" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="700" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#b45309">PLACEHOLDER — IMMAGINE MANCANTE</text>
  <text x="700" y="275" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#0f172a">ASFORNITURE — Espositori e Roll-Up Retroilluminati</text>
  <text x="700" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#475569">Sostituire con l&apos;artwork ufficiale allegato dall&apos;utente</text>
</svg>
